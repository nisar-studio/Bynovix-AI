<main class="flex-1 flex flex-col h-full bg-[#0C0C0E] relative">
<div class="flex-1 flex overflow-hidden">
<!-- Central Workspace -->
<div class="flex-1 flex flex-col h-full overflow-y-auto px-xl py-lg">
<div class="max-w-4xl mx-auto w-full flex flex-col gap-lg">
<!-- Input Area -->
<div class="relative w-full">
<div class="absolute inset-0 bg-gradient-to-r from-[#6366f1]/20 to-[#a855f7]/20 rounded-xl blur-md -z-10"></div>
<div class="bg-[#111114] border border-[#1f1f22] rounded-xl p-2 flex items-center shadow-lg focus-within:border-[#6366f1] transition-colors">
<span class="material-symbols-outlined text-[#6366f1] pl-3 pr-2">auto_awesome</span>
<input id="ai-question-input" class="flex-1 bg-transparent border-none text-surface-container-lowest font-body-lg text-body-lg focus:ring-0 placeholder:text-on-tertiary-container" placeholder="Ask a business question..." type="text" value=""/>
<button id="ai-send-btn" class="bg-gradient-to-r from-[#6366f1] to-[#a855f7] p-2 rounded-lg flex items-center justify-center mr-1 hover:opacity-90 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-white">send</span>
</button>
</div>
</div>
<!-- AI Response Area -->
<div id="ai-response-area" class="flex flex-col gap-md mt-sm">
<!-- Placeholder: instructions shown before first question -->
<div id="ai-placeholder" class="bg-[#111114] border border-[#1f1f22] rounded-xl p-lg text-center">
<span class="material-symbols-outlined text-[#6366f1] text-5xl mb-4 block">smart_toy</span>
<h3 class="font-headline-md text-headline-md text-white mb-2">AI Analyst</h3>
<p class="font-body-md text-gray-400 mb-4">Ask questions about your business data and get AI-powered insights.</p>
<div class="flex flex-wrap gap-2 justify-center">
<button class="ai-suggestion text-left p-3 rounded-lg border border-[#1f1f22] hover:bg-[#1a1a1f] transition-colors font-body-sm text-sm text-gray-300 max-w-xs">Why did revenue decline this month?</button>
<button class="ai-suggestion text-left p-3 rounded-lg border border-[#1f1f22] hover:bg-[#1a1a1f] transition-colors font-body-sm text-sm text-gray-300 max-w-xs">What are the top risks to our forecast?</button>
<button class="ai-suggestion text-left p-3 rounded-lg border border-[#1f1f22] hover:bg-[#1a1a1f] transition-colors font-body-sm text-sm text-gray-300 max-w-xs">Summarize our AI insights by severity</button>
<button class="ai-suggestion text-left p-3 rounded-lg border border-[#1f1f22] hover:bg-[#1a1a1f] transition-colors font-body-sm text-sm text-gray-300 max-w-xs">Which data sources need attention?</button>
</div>
</div>
<!-- Loading state (hidden by default) -->
<div id="ai-loading" class="bg-[#111114] border border-[#1f1f22] rounded-xl p-lg hidden">
<div class="flex items-center gap-3 mb-4">
<div class="w-8 h-8 rounded-full bg-gradient-to-r from-[#6366f1] to-[#a855f7] flex items-center justify-center">
<span class="material-symbols-outlined text-white" style="font-size:18px;">auto_awesome</span>
</div>
<div>
<p class="font-body-sm text-white font-medium">AI Analyst</p>
<p class="font-body-sm text-gray-400 text-sm">Analyzing your data...</p>
</div>
</div>
<div class="space-y-3">
<div class="h-4 bg-[#1a1a1f] rounded w-3/4 animate-pulse"></div>
<div class="h-4 bg-[#1a1a1f] rounded w-full animate-pulse"></div>
<div class="h-4 bg-[#1a1a1f] rounded w-5/6 animate-pulse"></div>
<div class="h-4 bg-[#1a1a1f] rounded w-2/3 animate-pulse"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Right Context Panel -->
<aside class="w-80 border-l border-[#1f1f22] bg-[#0a0a0c] flex flex-col h-full shrink-0">
<div class="p-md border-b border-[#1f1f22]">
<h4 class="font-label-mono text-label-mono text-gray-400 uppercase mb-3 text-xs">Data Sources</h4>
<div id="sidebar-sources" class="flex flex-col gap-2">
<p class="text-gray-500 text-sm">Loading...</p>
</div>
</div>
<div class="p-md border-b border-[#1f1f22] flex-1">
<h4 class="font-label-mono text-label-mono text-gray-400 uppercase mb-3 text-xs">Suggested Questions</h4>
<div class="flex flex-col gap-2">
<button class="ai-suggestion text-left p-3 rounded-lg border border-[#1f1f22] hover:bg-[#111114] transition-colors font-body-sm text-sm text-gray-300 flex items-start gap-2 group">
<span class="material-symbols-outlined text-gray-500 group-hover:text-[#6366f1] transition-colors" style="font-size: 16px; margin-top: 2px;">chat_bubble</span>
<span>What caused the supply chain disruption in the South Region?</span>
</button>
<button class="ai-suggestion text-left p-3 rounded-lg border border-[#1f1f22] hover:bg-[#111114] transition-colors font-body-sm text-sm text-gray-300 flex items-start gap-2 group">
<span class="material-symbols-outlined text-gray-500 group-hover:text-[#6366f1] transition-colors" style="font-size: 16px; margin-top: 2px;">chat_bubble</span>
<span>Forecast Product B revenue if we run a 15% discount campaign.</span>
</button>
<button class="ai-suggestion text-left p-3 rounded-lg border border-[#1f1f22] hover:bg-[#111114] transition-colors font-body-sm text-sm text-gray-300 flex items-start gap-2 group">
<span class="material-symbols-outlined text-gray-500 group-hover:text-[#6366f1] transition-colors" style="font-size: 16px; margin-top: 2px;">chat_bubble</span>
<span>Show me the demographic breakdown of the customer activity drop.</span>
</button>
</div>
</div>
<div class="p-md h-1/4 overflow-y-auto">
<h4 class="font-label-mono text-label-mono text-gray-400 uppercase mb-3 text-xs">Conversation History</h4>
<div id="chat-history" class="flex flex-col gap-3">
<p class="text-gray-500 text-sm">No conversations yet</p>
</div>
</div>
</aside>
</div>
</main>

<script>
(function(){
  var EDGE_URL = 'https://ddsjxafkhxijypgsbvcu.supabase.co/functions/v1/chat-ask';
  var ANON_KEY = window._sb ? window._sb.getHeaders?.()?.apikey || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkc2p4YWZraHhpanlwZ3NidmN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzQ0MDEsImV4cCI6MjEwMzE1MDQwMX0.WA_UVawLWJxa5b9zIPe-j4r6ua6uElQf0_L29TyHwPA' : 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkc2p4YWZraHhpanlwZ3NidmN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzQ0MDEsImV4cCI6MjEwMzE1MDQwMX0.WA_UVawLWJxa5b9zIPe-j4r6ua6uElQf0_L29TyHwPA';
  var conversationHistory = [];

  function waitForDB(){return new Promise(function(r){if(window.AppState&&window.AppState.profile&&window.DB)return r();var c=setInterval(function(){if(window.AppState&&window.AppState.profile&&window.DB){clearInterval(c);r();}},100);setTimeout(function(){clearInterval(c);r();},5000);});}

  waitForDB().then(async function(){
    // Load sidebar data sources
    try {
      var sources = await window.DB.getSourceConnections();
      var panel = document.getElementById('sidebar-sources');
      if (panel && sources.length > 0) {
        var html = '';
        sources.forEach(function(s){
          var color = s.status==='connected'?'#00d4ff':s.status==='syncing'?'#facc15':'#ef4444';
          html += '<div class="flex items-center justify-between">';
          html += '<div class="flex items-center gap-2">';
          html += '<span class="material-symbols-outlined" style="font-size:16px;color:'+color+'">database</span>';
          html += '<span class="font-body-sm text-sm text-gray-200">'+window.escHtml(s.name)+'</span></div>';
          html += '<span class="w-2 h-2 rounded-full" style="background:'+color+';box-shadow:0 0 8px '+color+'80"></span></div>';
        });
        panel.innerHTML = html;
      }
    } catch(e) { console.warn('Sidebar load error:', e); }

    // Send button handler
    var sendBtn = document.getElementById('ai-send-btn');
    var input = document.getElementById('ai-question-input');
    var responseArea = document.getElementById('ai-response-area');
    var loading = document.getElementById('ai-loading');
    var placeholder = document.getElementById('ai-placeholder');

    async function askQuestion(question) {
      if (!question.trim() || !window.AppState.profile) return;

      var orgId = window.AppState.profile.organization_id;
      var session = await window._sb.auth.getSession();
      var jwt = session.data?.session?.access_token;
      if (!jwt) { alert('Please log in again.'); return; }

      // Show loading, hide placeholder
      if (placeholder) placeholder.classList.add('hidden');
      loading.classList.remove('hidden');

      // Add user message to history
      addHistoryItem(question, 'user');

      try {
        var resp = await fetch(EDGE_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': ANON_KEY,
            'Authorization': 'Bearer ' + jwt
          },
          body: JSON.stringify({ question: question, org_id: orgId })
        });

        var data = await resp.json();
        loading.classList.add('hidden');

        if (data.success) {
          renderAIResponse(data.response, data.model, data.latency_ms, data.tokens_used, data.context_summary);
          addHistoryItem(question.substring(0, 60) + (question.length > 60 ? '...' : ''), 'assistant');
        } else {
          renderError(data.error || data.response || 'Failed to get AI response');
        }
      } catch(e) {
        loading.classList.add('hidden');
        renderError('Network error: ' + e.message);
      }
    }

    function renderAIResponse(text, model, latency, tokens, context) {
      // Convert markdown-like formatting to HTML
      var html = text
        .replace(/### (.*)/g, '<h3 class="font-headline-md text-white mt-4 mb-2">$1</h3>')
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
        .replace(/\* (.*?)(?=\n|$)/g, '<li class="ml-4 list-disc text-gray-300">$1</li>')
        .replace(/\n\n/g, '</p><p class="text-gray-300 leading-relaxed mb-3">')
        .replace(/\n/g, '<br>');

      var responseHtml = '<div class="bg-[#111114] border-l-2 border-[#6366f1] rounded-r-xl border-y border-r border-[#1f1f22] p-lg">';
      responseHtml += '<div class="flex items-center justify-between mb-4">';
      responseHtml += '<div class="flex items-center gap-2">';
      responseHtml += '<div class="w-6 h-6 rounded-full bg-gradient-to-r from-[#6366f1] to-[#a855f7] flex items-center justify-center">';
      responseHtml += '<span class="material-symbols-outlined text-white" style="font-size:14px">auto_awesome</span></div>';
      responseHtml += '<span class="font-headline-md text-white text-sm">AI Analyst</span></div>';
      responseHtml += '<div class="flex items-center gap-3">';
      if (model) responseHtml += '<span class="text-xs text-gray-500 font-mono">' + window.escHtml(model) + '</span>';
      if (latency) responseHtml += '<span class="text-xs text-gray-500">' + latency + 'ms</span>';
      if (tokens) responseHtml += '<span class="text-xs text-gray-500">' + tokens + ' tokens</span>';
      responseHtml += '</div></div>';
      responseHtml += '<div class="font-body-md text-sm leading-relaxed">' + html + '</div>';

      if (context) {
        responseHtml += '<div class="mt-4 pt-3 border-t border-[#1f1f22] flex gap-4 text-xs text-gray-500">';
        responseHtml += '<span>' + (context.forecasts || 0) + ' forecasts</span>';
        responseHtml += '<span>' + (context.insights || 0) + ' insights</span>';
        responseHtml += '<span>' + (context.actions || 0) + ' actions</span>';
        responseHtml += '<span>' + (context.sources || 0) + ' sources</span>';
        responseHtml += '</div>';
      }
      responseHtml += '</div>';

      responseArea.innerHTML = responseHtml;
    }

    function renderError(msg) {
      responseArea.innerHTML = '<div class="bg-red-500/10 border border-red-500/20 rounded-xl p-lg text-center">'
        + '<span class="material-symbols-outlined text-red-400 text-4xl block mb-2">error</span>'
        + '<p class="text-red-300">' + window.escHtml(msg) + '</p></div>';
    }

    function addHistoryItem(text, role) {
      var histEl = document.getElementById('chat-history');
      if (!histEl) return;
      // Remove "No conversations yet" placeholder
      var ph = histEl.querySelector('p');
      if (ph && ph.textContent === 'No conversations yet') ph.remove();

      var item = document.createElement('div');
      item.className = 'text-sm';
      var prefix = role === 'user' ? '<span class="text-[#6366f1] mr-1">Q:</span>' : '<span class="text-[#a855f7] mr-1">A:</span>';
      item.innerHTML = prefix + '<span class="text-gray-400 truncate block">' + window.escHtml(text) + '</span>';
      histEl.insertBefore(item, histEl.firstChild);

      // Keep only last 10
      while (histEl.children.length > 10) histEl.removeChild(histEl.lastChild);
    }

    // Wire send button
    if (sendBtn) {
      sendBtn.addEventListener('click', function() {
        askQuestion(input.value);
      });
    }

    // Wire Enter key
    if (input) {
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          askQuestion(input.value);
        }
      });
    }

    // Wire suggestion buttons
    document.querySelectorAll('.ai-suggestion').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var q = btn.textContent.trim();
        if (input) input.value = q;
        askQuestion(q);
      });
    });
  });
})();
</script>
